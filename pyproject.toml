[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathocr"
version = "0.1.0"
description = "Correction de copies manuscrites de mathématiques : OCR multi-moteurs, agents, vérification Lean 4 / Mathlib."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pillow>=10",
  "sympy>=1.13",
  "lark>=1.1",
  "rapidfuzz>=3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
mathpix = ["httpx>=0.27"]
all = ["anthropic>=1.0", "openai>=1.40", "google-genai>=1.0", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
mathocr = "mathocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathocr = ["prompts/*.md", "lean/*.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lean: tests qui exécutent réellement Lean (lents)"]
